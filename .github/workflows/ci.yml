name: CI

# Cost control, 2026-08-04. This repo is the only one on the account actually
# billing money (August: $12.80 of $12.80 total, all of it here). Two causes:
# every push to main re-ran what its PR had just run, and every run paid for
# macOS and Windows, which bill at 10x and 2x Linux respectively.
#
# So: PRs run Linux only, and the full matrix runs on demand.
#
# >> RE-ENABLE THE FULL MATRIX BEFORE CUTTING A RELEASE. <<
# Run this workflow manually (Actions -> CI -> Run workflow) and it builds all
# three platforms. Nothing else checks the Windows MSI definition or that the
# macOS/Windows builds still compile, and release.yml packages all three.
# Until then day-to-day work does not need them.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: ${{ matrix.os }} quality
    strategy:
      fail-fast: false
      matrix:
        # Linux on PRs; all three when dispatched by hand (see the note above).
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["macos-latest","ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan1 pkg-config xvfb x11-utils openbox mesa-vulkan-drivers
      # A malformed .wxs is only discovered when a release builds the MSI,
      # which is far too late. Parsing it costs nothing.
      - name: Check MSI definition
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $document = New-Object System.Xml.XmlDocument
          $document.Load((Resolve-Path "apps/sourcefour/wix/main.wxs"))
      - name: Verify lockfile
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Without this the run stops at whichever test fails first, which on a
      # platform that has never been green hides every other failure behind it.
      - name: Tests
        run: cargo nextest run --workspace --all-targets --locked --no-fail-fast
      - name: Locked debug build
        run: cargo build --workspace --locked
      - name: Locked release build
        run: cargo build --workspace --release --locked
      - name: Linux GUI startup
        if: runner.os == 'Linux'
        run: xvfb-run -a bash .github/scripts/smoke-linux.sh
