name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: ${{ matrix.os }} quality
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan1 pkg-config
      # A malformed .wxs is only discovered when a release builds the MSI,
      # which is far too late. Parsing it costs nothing.
      - name: Check MSI definition
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $document = New-Object System.Xml.XmlDocument
          $document.Load((Resolve-Path "apps/sourcefour/wix/main.wxs"))
      - name: Verify lockfile
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Without this the run stops at whichever test fails first, which on a
      # platform that has never been green hides every other failure behind it.
      - name: Tests
        run: cargo nextest run --workspace --all-targets --locked --no-fail-fast
      - name: Locked debug build
        run: cargo build --workspace --locked
      - name: Locked release build
        run: cargo build --workspace --release --locked
