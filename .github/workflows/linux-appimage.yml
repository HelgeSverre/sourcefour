name: Linux packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux packages
    # Built on the oldest runner we support so the AppImage's glibc floor stays
    # low enough for older distributions to run it.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils \
            file \
            libclang-dev \
            libfontconfig1-dev \
            libfuse2 \
            libvulkan1 \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: linux-appimage

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build Linux packages
        run: .github/scripts/package-linux-appimage.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-linux-appimage
          if-no-files-found: error
          path: |
            target/distrib/*.AppImage
            target/distrib/*.AppImage.sha256
            target/distrib/*.deb
            target/distrib/*.deb.sha256

  smoke:
    name: Test packaged AppImage on Ubuntu 22.04
    needs: build
    runs-on: ubuntu-22.04
    # A fresh runtime environment avoids the build's development packages
    # accidentally satisfying dependencies missing from the AppImage.
    container: ubuntu:22.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: artifacts-build-linux-appimage
          path: target/distrib
      - name: Install runtime and test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            binutils file libfontconfig1 libvulkan1 libxcb1 \
            mesa-vulkan-drivers openbox x11-utils xauth xvfb
      - name: Verify final artifact
        run: |
          cd target/distrib
          sha256sum --check sourcefour-x86_64-unknown-linux-gnu.AppImage.sha256
          chmod +x sourcefour-x86_64-unknown-linux-gnu.AppImage
          bash ../../.github/scripts/verify-linux-appimage.sh sourcefour-x86_64-unknown-linux-gnu.AppImage
      - name: Packaged AppImage GUI startup as an ordinary user
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          useradd --create-home smoke
          install -m 0755 target/distrib/sourcefour-x86_64-unknown-linux-gnu.AppImage /tmp/sourcefour.AppImage
          install -m 0755 .github/scripts/smoke-linux.sh /tmp/smoke-linux.sh
          runuser -u smoke -- xvfb-run -a bash /tmp/smoke-linux.sh /tmp/sourcefour.AppImage
