<title>sourcefour — GUI prototype</title>
<style>
  :root {
    color-scheme: only dark;
    --bg-page: #0b0c0f;
    --bg-chrome: #15171c;
    --bg-panel: #191c22;
    --bg-list: #1d2129;
    --bg-hover: #222734;
    --bg-sel: #263042;
    --border: #262a33;
    --border-strong: #2f3542;
    --text: #dfe3ec;
    --text2: #9aa2b3;
    --text3: #5f677a;
    --accent: #5b9dff;
    --green: #7ec96f;
    --orange: #e0a458;
    --purple: #b392f0;
    --red: #e5655e;
    --cyan: #64c7d6;
    --lane0: #5b9dff;
    --lane1: #7ec96f;
    --lane2: #e0a458;
    --lane3: #b392f0;
    --lane4: #e5655e;
    --lane5: #64c7d6;
    --row-h: 30px;
    --graph-w: 76px;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg-page);
    font-family: var(--font-ui);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .window {
    width: 1280px;
    height: 800px;
    display: flex;
    flex-direction: column;
    background: var(--bg-chrome);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  /* ── title bar ─────────────────────────────────────────── */
  .titlebar {
    height: 38px;
    flex: none;
    display: flex;
    align-items: center;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .traffic { display: flex; gap: 8px; }
  .traffic span { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .traffic .r { background: #ff5f57; }
  .traffic .y { background: #febc2e; }
  .traffic .g { background: #28c840; }
  .titlebar h1 {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text2);
    pointer-events: none;
  }
  .titlebar h1 b { color: var(--text); font-weight: 600; }

  /* ── toolbar ───────────────────────────────────────────── */
  .toolbar {
    height: 46px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 10px;
    border-bottom: 1px solid var(--border);
  }
  .tbtn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 54px;
    padding: 4px 8px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text2);
    font-family: var(--font-ui);
    font-size: 10px;
    cursor: pointer;
  }
  .tbtn:hover { background: var(--bg-hover); color: var(--text); }
  .tbtn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tbtn.planned { opacity: 0.38; }
  .tbtn.planned:hover { background: transparent; color: var(--text2); cursor: default; }
  .toolbar .spacer { flex: 1; }
  .filterbox {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 260px;
    height: 28px;
    padding: 0 10px;
    background: var(--bg-list);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .filterbox:focus-within { border-color: var(--accent); }
  .filterbox svg { width: 13px; height: 13px; stroke: var(--text3); fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
  .filterbox input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 12px;
  }
  .filterbox input::placeholder { color: var(--text3); }
  .filterbox kbd {
    font-family: var(--font-ui);
    font-size: 10px;
    color: var(--text3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
    flex: none;
  }

  /* ── body ──────────────────────────────────────────────── */
  .body { flex: 1; display: flex; min-height: 0; }

  /* ── sidebar ───────────────────────────────────────────── */
  .sidebar {
    width: 236px;
    flex: none;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 6px 0 12px;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }
  .section-head .count { font-weight: 500; }

  .wt {
    padding: 6px 14px 7px;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .wt:hover { background: var(--bg-hover); }
  .wt.selected { background: var(--bg-sel); border-left-color: var(--accent); }
  .wt-row1 { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .wt-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .wt-dot.on { background: var(--green); }
  .wt-dot.off { background: transparent; border: 1.5px solid var(--text3); }
  .wt-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wt-branch { color: var(--text2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto; flex: none; }
  .wt-path {
    margin-top: 2px;
    padding-left: 13px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip-current {
    flex: none;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 3px;
    padding: 0 4px;
    line-height: 14px;
  }

  .branch {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 26px;
    padding: 0 14px 0 15px;
    font-size: 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .branch:hover { background: var(--bg-hover); }
  .branch.selected { background: var(--bg-sel); border-left-color: var(--accent); }
  .branch .glyph { width: 13px; height: 13px; flex: none; stroke: var(--text3); fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .branch.selected .glyph { stroke: var(--accent); }
  .branch .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .branch.current .name { font-weight: 600; }
  .branch .ab { margin-left: auto; flex: none; font-size: 10px; font-family: var(--font-mono); color: var(--text3); }
  .branch .ab .up { color: var(--green); }
  .branch .ab .down { color: var(--orange); }

  .remote-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px 2px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text2);
  }
  .remote-group svg { width: 12px; height: 12px; stroke: var(--text3); fill: none; stroke-width: 1.8; stroke-linecap: round; }
  .remote-group .url { margin-left: auto; font-size: 9.5px; font-weight: 400; font-family: var(--font-mono); color: var(--text3); }
  .rbranch {
    display: flex;
    align-items: center;
    height: 24px;
    padding: 0 14px 0 34px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    border-left: 2px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rbranch:hover { background: var(--bg-hover); color: var(--text); }
  .rbranch.selected { background: var(--bg-sel); border-left-color: var(--orange); color: var(--text); }

  /* ── main ──────────────────────────────────────────────── */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-list); }

  .col-header {
    flex: none;
    display: grid;
    grid-template-columns: var(--graph-w) 1fr 148px 96px 74px;
    align-items: center;
    height: 26px;
    padding-right: 14px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text3);
    background: var(--bg-panel);
  }
  .col-header span:not(:first-child) { padding-left: 10px; }

  .list-wrap { flex: 1; min-height: 0; position: relative; overflow-y: auto; }
  .graph-svg { position: absolute; top: 0; left: 0; pointer-events: none; }

  .row {
    display: grid;
    grid-template-columns: var(--graph-w) 1fr 148px 96px 74px;
    align-items: center;
    height: var(--row-h);
    padding-right: 14px;
    cursor: default;
    position: relative;
  }
  .row:hover { background: var(--bg-hover); }
  .row.selected { background: var(--bg-sel); }
  .row.selected::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
  }
  .row.dimmed { opacity: 0.32; }

  .msg {
    padding-left: 10px;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .msg .subject { overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 100%; }
  .row.merge .subject { color: var(--text2); }

  .lbl {
    flex: none;
    font-size: 10px;
    font-weight: 600;
    font-family: var(--font-mono);
    border-radius: 4px;
    padding: 1px 6px;
    line-height: 15px;
    white-space: nowrap;
  }
  .lbl.head { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); }
  .lbl.local { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .lbl.remote { color: var(--orange); background: color-mix(in srgb, var(--orange) 13%, transparent); }
  .lbl.tag { color: var(--purple); background: color-mix(in srgb, var(--purple) 13%, transparent); }

  .author, .date { font-size: 11.5px; color: var(--text2); padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hash { font-family: var(--font-mono); font-size: 11px; color: var(--text3); padding-left: 10px; }
  .row.selected .hash { color: var(--accent); }

  /* ── details pane ──────────────────────────────────────── */
  .details {
    flex: none;
    height: 268px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    overflow-y: auto;
  }
  .details-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px 0;
  }
  .details-hash { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
  .mini-btn {
    font-family: var(--font-ui);
    font-size: 10.5px;
    color: var(--text2);
    background: var(--bg-list);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .mini-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .details-subject { padding: 8px 14px 0; font-size: 13px; font-weight: 600; }
  .details-body { padding: 4px 14px 0; font-size: 11.5px; color: var(--text2); line-height: 1.5; }
  .details-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 12px;
    padding: 8px 14px 0;
    font-size: 11px;
  }
  .details-meta dt { color: var(--text3); }
  .details-meta dd { color: var(--text2); font-family: var(--font-mono); font-size: 10.5px; }

  .details .section-head { padding: 12px 14px 4px; border-top: 1px solid var(--border); margin-top: 10px; }
  .file {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 24px;
    padding: 0 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
  }
  .file:hover { background: var(--bg-hover); }
  .file.selected { background: var(--bg-sel); }
  .file .badge { flex: none; width: 14px; text-align: center; font-weight: 700; font-size: 10px; border-radius: 3px; }
  .file .badge.m { color: var(--orange); background: color-mix(in srgb, var(--orange) 14%, transparent); }
  .file .badge.a { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .file .path { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .file .stats { flex: none; font-size: 10px; }
  .file .stats .add { color: var(--green); }
  .file .stats .del { color: var(--red); }

  .diff {
    margin: 8px 14px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.65;
  }
  .diff-file {
    padding: 4px 10px;
    background: var(--bg-list);
    border-bottom: 1px solid var(--border);
    color: var(--text2);
  }
  .dl { padding: 0 10px; white-space: pre; }
  .dl.hunk { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 6%, transparent); }
  .dl.add { color: #92d982; background: rgba(126, 201, 111, 0.10); }
  .dl.del { color: #ef8b84; background: rgba(229, 101, 94, 0.10); }
  .dl.ctx { color: var(--text3); }

  /* ── status bar ────────────────────────────────────────── */
  .statusbar {
    flex: none;
    height: 26px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 12px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text3);
  }
  .statusbar .item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .statusbar svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .statusbar .branch-name { color: var(--text2); font-weight: 600; }
  .statusbar .up { color: var(--green); }
  .statusbar .path { font-family: var(--font-mono); font-size: 10px; }
  .statusbar .spacer { flex: 1; }
  .statusbar .perf { font-family: var(--font-mono); font-size: 10px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #31374495; border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #3d445295; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

const WORKTREES = [
  { name: "sourcefour", branch: "main", path: "~/code/sourcefour", current: true },
  { name: "sourcefour-perf", branch: "perf/revwalk-batch", path: "~/code/.worktrees/sourcefour-perf", current: false },
  { name: "sourcefour-hotfix", branch: "fix/graph-lanes", path: "~/code/.worktrees/sourcefour-hotfix", current: false },
];

const BRANCHES = [
  { name: "main", tip: "9f3e21a", current: true, ab: "↑2" },
  { name: "feature/worktrees", tip: "4b8e0f2", current: false, ab: "" },
  { name: "perf/revwalk-batch", tip: "d84c2a6", current: false, ab: "↑1" },
  { name: "feature/diff-pane", tip: "8ab4e15", current: false, ab: "↓1" },
  { name: "fix/graph-lanes", tip: "f20c6d3", current: false, ab: "" },
];

const RBRANCHES = ["main", "feature/worktrees", "feature/diff-pane", "perf/revwalk-batch"];

const byId = Object.fromEntries(COMMITS.map(c => [c.id, c]));
const ROW_H = 30, GRAPH_W = 76, LANE_X0 = 26, LANE_DX = 18;

let state = { selected: COMMITS[0].id, filter: "", branchTip: null };

function reachableFrom(tipId) {
  const seen = new Set();
  const stack = [tipId];
  while (stack.length) {
    const id = stack.pop();
    if (seen.has(id) || !byId[id]) continue;
    seen.add(id);
    byId[id].parents.forEach(p => stack.push(p));
  }
  return seen;
}

function visibleCommits() {
  const q = state.filter.trim().toLowerCase();
  if (!q) return COMMITS;
  return COMMITS.filter(c =>
    c.msg.toLowerCase().includes(q) ||
    c.author.toLowerCase().includes(q) ||
    c.full.startsWith(q) || c.id.startsWith(q)
  );
}

function assignLanes(list) {
  const lanes = [];
  const laneOf = new Map();
  for (const c of list) {
    let lane = lanes.indexOf(c.id);
    if (lane === -1) { lane = lanes.length; lanes.push(null); }
    laneOf.set(c.id, lane);
    lanes[lane] = c.parents[0] ?? null;
    for (let i = 0; i < lanes.length; i++) {
      if (i !== lane && lanes[i] === c.id) lanes[i] = null;
    }
    for (const p of c.parents.slice(1)) {
      if (lanes.includes(p)) continue;
      const free = lanes.indexOf(null);
      if (free === -1) lanes.push(p); else lanes[free] = p;
    }
  }
  return { laneOf, maxLane: Math.max(0, ...laneOf.values()) };
}

function laneX(l) { return LANE_X0 + l * LANE_DX; }
function rowY(i) { return i * ROW_H + ROW_H / 2; }

function renderGraph(list, laneOf) {
  const svg = document.getElementById("graph");
  const h = list.length * ROW_H;
  svg.setAttribute("width", GRAPH_W);
  svg.setAttribute("height", h);
  svg.setAttribute("viewBox", `0 0 ${GRAPH_W} ${h}`);
  let out = "";
  const idx = new Map(list.map((c, i) => [c.id, i]));
  for (let i = 0; i < list.length; i++) {
    const c = list[i];
    const l = laneOf.get(c.id);
    for (const p of c.parents) {
      const pi = idx.get(p);
      if (pi === undefined) continue;
      const pl = laneOf.get(p);
      const x1 = laneX(l), y1 = rowY(i), x2 = laneX(pl), y2 = rowY(pi);
      const color = LANE_COLORS[pl % LANE_COLORS.length];
      if (l === pl) {
        out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2"/>`;
      } else {
        const c1y = y1 + ROW_H * 0.8, c2y = y2 - ROW_H * 0.8;
        out += `<path d="M ${x1} ${y1} C ${x1} ${c1y}, ${x2} ${c2y}, ${x2} ${y2}" stroke="${color}" stroke-width="2" fill="none"/>`;
      }
    }
  }
  for (let i = 0; i < list.length; i++) {
    const c = list[i];
    const l = laneOf.get(c.id);
    const color = LANE_COLORS[l % LANE_COLORS.length];
    out += `<circle cx="${laneX(l)}" cy="${rowY(i)}" r="4" fill="var(--bg-list)" stroke="${color}" stroke-width="2"/>`;
    if (c.labels.some(([_, t]) => t === "head")) {
      out += `<circle cx="${laneX(l)}" cy="${rowY(i)}" r="7.5" fill="none" stroke="${color}" stroke-width="1" opacity="0.55"/>`;
    }
  }
  svg.innerHTML = out;
}

function chip([text, kind]) {
  return `<span class="lbl ${kind}">${text}</span>`;
}

function renderRows(list, laneOf) {
  const rowsEl = document.getElementById("rows");
  const reach = state.branchTip ? reachableFrom(state.branchTip) : null;
  rowsEl.innerHTML = list.map(c => {
    const cls = [
      "row",
      c.id === state.selected ? "selected" : "",
      c.merge ? "merge" : "",
      reach && !reach.has(c.id) ? "dimmed" : "",
    ].join(" ");
    return `<div class="${cls}" data-id="${c.id}">
      <span></span>
      <div class="msg">${c.labels.map(chip).join("")}<span class="subject">${c.msg}</span></div>
      <span class="author">${c.author}</span>
      <span class="date">${c.date}</span>
      <span class="hash">${c.id}</span>
    </div>`;
  }).join("");
  rowsEl.querySelectorAll(".row").forEach(el => {
    el.addEventListener("click", () => { state.selected = el.dataset.id; render(); });
  });
}

function renderDetails() {
  const c = byId[state.selected];
  const el = document.getElementById("details");
  const parents = c.parents.length ? c.parents.join(" ") : "—";
  const diffHtml = c.diff ? `
    <div class="section-head">Diff</div>
    <div class="diff">
      <div class="diff-file">${c.diff[0]}</div>
      ${c.diff[1].map(([k, line]) => `<div class="dl ${k}">${line || "&nbsp;"}</div>`).join("")}
    </div>` : "";
  el.innerHTML = `
    <div class="details-head">
      <span class="details-hash">${c.full}</span>
      <button class="mini-btn">Copy SHA</button>
      <button class="mini-btn">Browse files</button>
    </div>
    <div class="details-subject">${c.msg}</div>
    ${c.body ? `<div class="details-body">${c.body}</div>` : ""}
    <dl class="details-meta">
      <dt>Author</dt><dd>${c.author} &lt;helge@sourcefour.dev&gt;</dd>
      <dt>Parents</dt><dd>${parents}</dd>
    </dl>
    <div class="section-head">Files <span class="count">${c.files.length}</span></div>
    ${c.files.map(([badge, path, add, del], i) => `
      <div class="file ${i === 0 ? "selected" : ""}">
        <span class="badge ${badge.toLowerCase()}">${badge}</span>
        <span class="path">${path}</span>
        <span class="stats"><span class="add">+${add}</span> <span class="del">−${del}</span></span>
      </div>`).join("")}
    ${diffHtml}`;
}

function renderSidebar() {
  document.getElementById("worktrees").innerHTML = WORKTREES.map(w => `
    <div class="wt ${w.current ? "selected" : ""}">
      <div class="wt-row1">
        <span class="wt-dot ${w.current ? "on" : "off"}"></span>
        <span class="wt-name">${w.name}</span>
        ${w.current ? '<span class="chip-current">CURRENT</span>' : ""}
        <span class="wt-branch">${w.branch}</span>
      </div>
      <div class="wt-path">${w.path}</div>
    </div>`).join("");

  document.getElementById("branches").innerHTML = BRANCHES.map(b => `
    <div class="branch ${b.current ? "current" : ""} ${state.branchTip === b.tip ? "selected" : ""}" data-tip="${b.tip}">
      <svg class="glyph" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="8" r="2.4"/><path d="M6 8.4v7.2"/></svg>
      <span class="name">${b.name}</span>
      ${b.ab ? `<span class="ab">${b.ab.replace("↑", '<span class="up">↑</span>').replace("↓", '<span class="down">↓</span>')}</span>` : ""}
    </div>`).join("");

  document.getElementById("rbranches").innerHTML = RBRANCHES.map(n =>
    `<div class="rbranch" data-name="${n}">origin/${n}</div>`).join("");

  document.querySelectorAll(".branch").forEach(el => {
    el.addEventListener("click", () => {
      state.branchTip = state.branchTip === el.dataset.tip ? null : el.dataset.tip;
      render();
    });
  });
  document.querySelectorAll(".rbranch").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll(".rbranch").forEach(x => x.classList.remove("selected"));
      el.classList.add("selected");
    });
  });
  document.querySelectorAll(".wt").forEach(el => {
    el.addEventListener("click", () => {
      document.querySelectorAll(".wt").forEach(x => x.classList.remove("selected"));
      el.classList.add("selected");
    });
  });
}

function render() {
  const list = visibleCommits();
  const { laneOf } = assignLanes(list);
  if (!list.some(c => c.id === state.selected)) state.selected = list[0]?.id ?? COMMITS[0].id;
  renderGraph(list, laneOf);
  renderRows(list, laneOf);
  renderDetails();
  renderSidebar();
  const sel = document.querySelector(".row.selected");
  if (sel) sel.scrollIntoView({ block: "nearest" });
}

document.getElementById("filter").addEventListener("input", e => {
  state.filter = e.target.value;
  render();
});

window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "f") {
    e.preventDefault();
    document.getElementById("filter").focus();
    return;
  }
  if (document.activeElement === document.getElementById("filter")) {
    if (e.key === "Escape") { e.target.value = ""; state.filter = ""; render(); e.target.blur(); }
    return;
  }
  const list = visibleCommits();
  const i = list.findIndex(c => c.id === state.selected);
  if (e.key === "ArrowDown" && i < list.length - 1) { state.selected = list[i + 1].id; render(); }
  if (e.key === "ArrowUp" && i > 0) { state.selected = list[i - 1].id; render(); }
});
