<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0b0c0f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    color: #dfe3ec;
    position: relative;
  }

  .glow {
    position: absolute;
    top: -260px;
    right: -220px;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(91, 157, 255, 0.16), rgba(91, 157, 255, 0) 70%);
  }

  .mark {
    position: absolute;
    right: -60px;
    bottom: -90px;
    width: 460px;
    height: 460px;
    opacity: 0.5;
  }

  .brand {
    position: absolute;
    top: 64px;
    left: 72px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand svg { width: 30px; height: 30px; }
  .brand span {
    font-family: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", monospace;
    font-size: 26px;
    letter-spacing: -0.04em;
    color: #dfe3ec;
  }

  .content {
    position: absolute;
    left: 72px;
    right: 260px;
    top: 220px;
  }

  .eyebrow {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #7ec96f;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 58px;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: #f4f6fa;
    font-weight: 600;
    margin-bottom: 22px;
  }

  p {
    font-size: 25px;
    line-height: 1.45;
    color: #9aa2b3;
    max-width: 34ch;
  }

  .domain {
    position: absolute;
    left: 72px;
    bottom: 56px;
    font-family: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", monospace;
    font-size: 20px;
    color: #5f677a;
  }
</style>
<script src="https://analytics.ahrefs.com/analytics.js" data-key="CjACu0k6sPeWJY+zVpyKZA" async></script>
</head>
<body>
  <div class="glow"></div>
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="#7ec96f" d="m2.9 6.7 7.4-4.3 4.3 7.4-7.4 4.3Z"/>
    <path fill="#5b9dff" d="m9.4 14.2 7.4-4.3 4.3 7.4-7.4 4.3Z"/>
  </svg>

  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#7ec96f" d="m2.9 6.7 7.4-4.3 4.3 7.4-7.4 4.3Z"/>
      <path fill="#5b9dff" d="m9.4 14.2 7.4-4.3 4.3 7.4-7.4 4.3Z"/>
    </svg>
    <span>Sourcefour</span>
  </div>

  <div class="content">
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>

  <div class="domain">sourcefour.dev</div>
</body>
</html>
