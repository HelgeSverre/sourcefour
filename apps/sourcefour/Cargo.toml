[package]
name = "sourcefour"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
authors.workspace = true

[[bin]]
name = "sourcefour"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "4d00d07df1f3d921aeb1fb630c8d9a1789e6b602" }
gix-imara-diff.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
sourcefour-doc = { path = "../../crates/sourcefour-doc" }
sourcefour-git = { path = "../../crates/sourcefour-git" }
sourcefour-github = { path = "../../crates/sourcefour-github" }
sourcefour-graph = { path = "../../crates/sourcefour-graph" }
sourcefour-model = { path = "../../crates/sourcefour-model" }
syntect.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "4d00d07df1f3d921aeb1fb630c8d9a1789e6b602", features = ["test-support"] }
sourcefour-test-support = { path = "../../crates/sourcefour-test-support" }
tempfile.workspace = true

[lints]
workspace = true

# Drives the macOS .app that gets wrapped into the signed .pkg, and the Linux
# AppImage. Assets are compiled into the binary, so neither format ships a
# resources directory.
[package.metadata.packager]
before-packaging-command = "cargo build --release --locked -p sourcefour"
product-name = "Sourcefour"
identifier = "no.lisethsolutions.sourcefour"
icons = ["assets/icon/Sourcefour.png", "assets/icon/Sourcefour.icns"]
formats = ["app"]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
signing-identity = "-"

[package.metadata.wix]
upgrade-guid = "519EB068-09EF-4C12-97E0-0C5EE8BE248D"
path-guid = "B14FC9E3-A9B9-48FB-9D4A-45084077A0B3"
license = false
eula = false
