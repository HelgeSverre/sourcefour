[workspace]
members = [
    "apps/sourcefour",
    "crates/sourcefour-model",
    "crates/sourcefour-git",
    "crates/sourcefour-graph",
    "crates/sourcefour-test-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HelgeSverre/sourcefour"
homepage = "https://github.com/HelgeSverre/sourcefour"
description = "A fast, native Git history browser you launch from your terminal"
authors = ["Sourcefour contributors"]

[workspace.dependencies]
gix = "0.85.0"
gix-imara-diff = { version = "0.2.4", features = ["unified_diff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15.1"
tempfile = "3.27.0"
thiserror = "2.0.17"
unicode-segmentation = "1.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
