[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["homebrew", "msi"]
tap = "helgesverre/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
packages = ["sourcefour"]
precise-builds = true
merge-tasks = true
pr-run-mode = "skip"
# release.yml is hand-edited to gate every release job on the test suite and to
# fold in the signed .pkg and the AppImage, neither of which cargo-dist 0.32
# can produce. The WiX definition is customized with branding, a Start Menu
# shortcut, and the instructional boilerplate removed.
allow-dirty = ["ci", "msi"]

# GPUI links against XKB and XCB on Linux; the rest of the desktop libraries
# are loaded at runtime.
[dist.dependencies.apt]
libxcb1-dev = { version = "*", targets = ["x86_64-unknown-linux-gnu"] }
libxkbcommon-x11-dev = { version = "*", targets = ["x86_64-unknown-linux-gnu"] }

# Pinned to commits, not tags: a moved tag would silently change what runs.
# Update these together with the pins in the hand-written workflows.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"

[dist.github-custom-runners]
x86_64-apple-darwin = "macos-14"
