[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["homebrew"]
tap = "helgesverre/homebrew-tap"
publish-jobs = ["homebrew"]
# macOS only for now. The app builds on Linux (GPUI/X11) but has never shipped
# there; add the two linux-gnu targets once the Linux CI job has stayed green.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
packages = ["sourcefour"]
precise-builds = true
merge-tasks = true
pr-run-mode = "skip"
# release.yml is hand-edited to gate every release job on the test suite, which
# cargo-dist 0.32 cannot express in generated output.
allow-dirty = ["ci"]

[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"

[dist.github-custom-runners]
x86_64-apple-darwin = "macos-14"
